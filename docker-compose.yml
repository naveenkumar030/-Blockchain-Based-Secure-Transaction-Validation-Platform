services:
  mongodb:
    image: mongo:6.0
    container_name: gstapp_mongodb
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mongo_data:/data/db
    networks:
      - gstapp_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gstapp_web
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/gstrecounciliation_user}
      - PORT=8000
      - FRONTEND_URL=${FRONTEND_URL:-}
    volumes:
      - app_data:/app/backend/data
    depends_on:
      - mongodb
    networks:
      - gstapp_net

volumes:
  mongo_data:
  app_data:

networks:
  gstapp_net:
    driver: bridge
